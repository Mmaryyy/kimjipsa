<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>명단 · 결혼 준비 · 김집사</title>
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/app.css" />
  <style>
    /* 한 목록 전체를 한 grid 로 두고 행은 subgrid: 태그 토글이 사람마다 같은 x 에 선다 */
    .people { display: grid; grid-template-columns: minmax(0, 1fr) repeat(var(--tag-n), max-content); column-gap: var(--sp-1); margin-top: var(--sp-2); }
    .people > li { display: grid; grid-column: 1 / -1; grid-template-columns: subgrid; align-items: center; min-height: 52px; }
    .person-head { display: flex; align-items: center; gap: var(--sp-2); min-width: 0; text-align: left; min-height: var(--hit); }
    .person-head .row-title, .person-head .row-meta { line-height: 20px; }
    .person-head .row-title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .person-head .row-meta { flex: none; margin: 0; }
    /* 태그 토글 (OD 원본): 회색 면 → 완료면 초록 면 + 체크. 보이는 높이 28px, 누름 44px */
    .tag { position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 4px; height: 28px; padding: 0 var(--sp-2); border-radius: var(--r-control); background: var(--fill-tertiary); font-size: var(--type-caption-sm-size); font-weight: var(--fw-medium); color: var(--label); white-space: nowrap; }
    .tag::after { content: ""; position: absolute; inset: -8px -2px; }
    .tag svg { width: 12px; height: 12px; display: none; }
    .tag[aria-pressed="true"] { background: var(--success-soft); color: var(--success-text); }
    .tag[aria-pressed="true"] svg { display: block; }
    /* 태그가 없는 사람: 같은 자리에 비활성 토글(점선, 옅은 글자)로 줄을 맞춘다 */
    .tag:disabled { background: none; box-shadow: inset 0 0 0 1px var(--separator); color: var(--label-quaternary); cursor: default; }
    .tag:disabled::after { content: none; }
    /* 요약 면 안 태그 카드: 면보다 한 단계 다른 바탕(--bg), 4px. 누를 수 없는 요약 표시 */
    .tag-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: var(--sp-2); margin-top: var(--sp-2); }
    .tag-card { display: grid; gap: 2px; min-height: 72px; padding: var(--sp-2) var(--sp-3); border-radius: var(--r-control); background: var(--bg); text-align: left; }
    .tc-label { font-size: var(--type-caption-sm-size); font-weight: var(--fw-medium); color: var(--label-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .tc-num { font-size: var(--type-headline-size); font-weight: var(--fw-semibold); font-variant-numeric: tabular-nums; }
    .tc-num span { font-size: var(--type-caption-size); font-weight: var(--fw-regular, 400); color: var(--label-secondary); }
    .tag-card .bar { margin-top: 4px; }
    .people { margin-top: var(--sp-1); }
    /* 태그 칩 필터 (OD 원본): 보이는 높이 32px, 누름 44px */
    .chips { margin-top: var(--sp-3); padding: var(--sp-2) 0; }
    .chip { height: 32px; }
    .chip::after { inset: -6px 0; }
  </style>
</head>
<body>
  <div class="app">
    <main class="page" data-od-id="prj-lists">
      <aside class="od-diff" aria-label="원래 OD 시안과 달라진 점"><b>원래 OD 시안과 달라진 점</b>
        <ul><li>OD 원본 구조(요약 면 + 칩 필터 + 태그 토글). 요약 면 안 태그별 숫자를 카드(완료/대상 + 막대)로 나눔, 카드는 표시만. 칩은 누름 44px</li>
        <li>행: [성함] [관계] … [답례품] [별도 연락] [만남] 토글을 사람마다 같은 자리에. 태그가 없으면 비활성 토글</li>
        <li>‘후보 목록 | 명단’ 세그먼트 삭제, 목록 설정은 머리 [설정]</li></ul></aside>
      <header class="ph">
        <a class="ph-back" href="project.html" aria-label="프로젝트 개요"></a>
        <div style="flex:1;min-width:0"><h1 class="t-title-lg" id="title" data-od-id="prj-lists-title"></h1><p class="ph-sub t-caption">결혼 준비</p></div>
        <div class="ph-actions">
          <button class="glass-btn glass-surface" id="add" data-od-id="prj-list-add">추가</button>
          <button class="glass-btn glass-surface" id="settings" data-od-id="prj-list-settings">설정</button>
        </div>
      </header>
      <div id="body"></div>
    </main>
  </div>
  <script src="js/app.js"></script>
  <script>
    if (new URLSearchParams(location.search).get("kind") !== "people") location.replace("project-candidates.html");
    const K = KJ, { db, save, esc, icon, sheet, toast, field } = K;
    K.shell();
    document.querySelector(".ph-back").innerHTML = icon("back");
    const ppl = db().lists.find((l) => l.id === "l2");
    document.getElementById("title").textContent = ppl.name;
    const items = () => db().listItems.filter((x) => x.list_id === ppl.id);
    let tagFilter = "";

    function render() {
      const list = items();
      const vis = tagFilter ? list.filter((p) => p.tags.includes(tagFilter)) : list;
      const rel = ppl.columns[0];
      document.getElementById("body").innerHTML = `
        <section class="summary" aria-label="태그별 진행" data-od-id="prj-people-summary">
          <p class="t-caption-sm muted">${list.length}명</p>
          <div class="tag-cards" aria-label="태그별 진행">${ppl.tags.map((t) => { const all = list.filter((p) => p.tags.includes(t.key)), done = all.filter((p) => p.done_tags.includes(t.key));
            return `<div class="tag-card" role="group" aria-label="${esc(t.label)} ${all.length}명 중 ${done.length}명 완료">
              <span class="tc-label">${esc(t.label)}</span><span class="tc-num">${done.length}<span> / ${all.length}</span></span>
              <span class="bar" aria-hidden="true"><i style="width:${all.length ? (done.length / all.length) * 100 : 0}%"></i></span></div>`; }).join("")}</div>
        </section>
        <div class="chips" role="group" aria-label="태그로 보기">
          <button class="chip" data-f="" aria-pressed="${!tagFilter}">모두</button>
          ${ppl.tags.map((t) => `<button class="chip" data-f="${t.key}" aria-pressed="${tagFilter === t.key}">${esc(t.label)}</button>`).join("")}
        </div>
        <ul class="list people" style="--tag-n:${ppl.tags.length}" data-od-id="prj-people-list">${vis.map((p) => `
          <li data-od-id="prj-person-${p.id}">
            <button class="person-head" data-edit="${p.id}"><span class="row-title strong">${esc(p.title)}</span>${p.values[rel.key] ? `<span class="row-meta">${esc(p.values[rel.key])}</span>` : ""}</button>
            ${ppl.tags.map((t) => { const has = p.tags.includes(t.key), done = p.done_tags.includes(t.key);
              return has ? `<button class="tag" aria-pressed="${done}" aria-label="${esc(p.title)} ${esc(t.label)}" data-p="${p.id}" data-tag="${t.key}">${icon("check")}${esc(t.label)}</button>`
                         : `<button class="tag" disabled aria-label="${esc(p.title)}: ${esc(t.label)} 대상 아님">${esc(t.label)}</button>`; }).join("")}
          </li>`).join("") || `<li class="empty">이 태그가 붙은 사람이 없어요</li>`}</ul>`;
      document.querySelectorAll("[data-f]").forEach((b) => b.onclick = () => { tagFilter = b.dataset.f; render(); });
      document.querySelectorAll("[data-tag]").forEach((b) => b.onclick = () => {
        const p = list.find((x) => x.id === b.dataset.p), k = b.dataset.tag;
        p.done_tags = p.done_tags.includes(k) ? p.done_tags.filter((x) => x !== k) : [...p.done_tags, k]; save(); render();
      });
      document.querySelectorAll("[data-edit]").forEach((b) => b.onclick = () => editPerson(list.find((x) => x.id === b.dataset.edit)));
    }

    function editPerson(src) {
      const p = src || { list_id: "l2", title: "", values: {}, tags: [], done_tags: [] };
      sheet({ title: src ? "사람" : "새 사람",
        body: field("title", "이름", `<input name="title" maxlength="100" value="${esc(p.title)}">`)
          + ppl.columns.map((c) => field("c-" + c.key, c.label, `<input name="c-${c.key}" value="${esc(p.values[c.key])}">`)).join("")
          + `<div class="field"><span>태그</span><ul class="list">${ppl.tags.map((t) => `<li><label class="row"><input type="checkbox" name="t-${t.key}" ${p.tags.includes(t.key) ? "checked" : ""} style="width:20px;height:20px">${esc(t.label)}</label></li>`).join("")}</ul></div>`,
        onSubmit(d) {
          if (!d.title.trim()) return { title: true };
          const tags = ppl.tags.map((t) => t.key).filter((k) => d["t-" + k]);
          Object.assign(p, { title: d.title.trim(), tags, done_tags: p.done_tags.filter((k) => tags.includes(k)), values: Object.fromEntries(ppl.columns.map((c) => [c.key, d["c-" + c.key].trim()])) });
          if (!src) db().listItems.push({ id: "pp" + K.id(), ...p });
          save(); render(); toast(src ? "저장했어요" : "명단에 추가했어요");
        },
        danger: src && { label: "명단에서 삭제", confirm: `'${p.title}'님을 명단에서 삭제할까요?`, run: () => { db().listItems = db().listItems.filter((y) => y !== src); save(); render(); } } });
    }

    function openSettings() {
      sheet({ title: "목록 설정", onSubmit(d) { if (!d.name.trim()) return { name: true }; ppl.name = d.name.trim(); save(); location.reload(); },
        body: field("name", "목록 이름", `<input name="name" maxlength="100" value="${esc(ppl.name)}">`)
          + `<p class="group-label">사용자 정의 칸</p><ul class="list">${ppl.columns.map((c) => `<li class="row"><div class="row-main"><p class="row-title">${esc(c.label)}</p></div>${icon("chev", "chev")}</li>`).join("")}</ul>`
          + `<p class="group-label">태그</p><ul class="list">${ppl.tags.map((t) => `<li class="row"><div class="row-main"><p class="row-title">${esc(t.label)}</p></div>${icon("chev", "chev")}</li>`).join("")}</ul>` });
    }

    document.getElementById("add").onclick = () => editPerson();
    document.getElementById("settings").onclick = openSettings;
    render();
  </script>
</body>
</html>
