<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>일정 · 김집사</title>
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/app.css" />
    <style>
      .cal-bar {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 8px;
      }
      .cal-bar .segmented {
        flex: 1;
        max-width: 280px;
      }
      /* Month grid — Apple Calendar plain grid, 구분선 없이 여백으로 */
      .dow-row,
      .month {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
      }
      .dow-row {
        margin-top: 16px;
        padding-bottom: 4px;
      }
      .dow-row span {
        text-align: center;
        font-size: var(--text-caption1);
        color: var(--label-secondary);
        letter-spacing: 0.02em;
      }
      .dow-row span:first-child {
        color: var(--sys-red-ic);
      }
      .month button {
        min-height: 56px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        padding-top: 6px;
      }
      .month .d {
        width: 30px;
        height: 30px;
        display: grid;
        place-items: center;
        border-radius: var(--r-round);
        font-variant-numeric: tabular-nums;
        font-size: var(--text-callout);
      }
      .month .out .d {
        color: var(--label-tertiary);
      }
      .month .sun .d {
        color: var(--sys-red-ic);
      }
      .month .today .d {
        color: var(--accent);
        font-weight: var(--fw-bold);
      }
      .month [aria-pressed="true"] .d {
        background: var(--label);
        color: var(--bg);
        font-weight: var(--fw-semibold);
      }
      .month .dots {
        display: flex;
        gap: 3px;
        height: 5px;
      }
      .month .dots i {
        width: 5px;
        height: 5px;
        border-radius: var(--r-round);
        background: var(--c);
      }
      @media (min-width: 1024px) {
        .month button {
          min-height: 84px;
        }
      }
      /* Day view (hour rows) */
      .hours li {
        align-items: flex-start;
        min-height: 48px;
      }
      .hours .h {
        width: 52px;
        flex: none;
        font-size: var(--text-caption1);
        color: var(--label-tertiary);
        font-variant-numeric: tabular-nums;
        padding-top: 2px;
      }
      .hours .slot {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .hours .ev {
        display: flex;
        gap: 8px;
        align-items: center;
        text-align: left;
        font-size: var(--text-subhead);
      }
      .hours .ev.is-private {
        color: var(--label-tertiary);
      }
      .row-click {
        cursor: pointer;
      }
      .detail dt {
        font-size: var(--text-footnote);
        color: var(--label-secondary);
        margin-top: 14px;
      }
      .detail dd {
        margin: 2px 0 0;
      }
      .cat-select {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-left: auto;
      }
      .cat-select select {
        text-align: right;
      }
      .form-note {
        font-size: var(--text-footnote);
        color: var(--label-secondary);
        padding: 6px 0 2px;
      }
    </style>
  </head>
  <body data-page="calendar">
    <div class="app">
      <main class="main wide" data-od-id="calendar-main">
        <header class="page-head" data-od-id="calendar-header">
          <div class="bar">
            <button
              type="button"
              class="icon-btn"
              id="prev"
              aria-label="이전"
              data-od-id="cal-prev"
            >
              <i data-icon="back"></i>
            </button>
            <button
              type="button"
              class="icon-btn"
              id="next"
              aria-label="다음"
              data-od-id="cal-next"
            >
              <i data-icon="chevron"></i>
            </button>
            <div class="actions">
              <button
                type="button"
                class="icon-btn"
                id="add"
                aria-label="일정 추가"
                data-od-id="cal-add"
              >
                <i data-icon="plus"></i>
              </button>
            </div>
          </div>
          <h1 class="t-large" id="cal-title" data-od-id="cal-title">
            2026년 10월
          </h1>
          <div class="cal-bar">
            <div
              class="segmented"
              role="group"
              aria-label="보기"
              data-od-id="cal-view"
            >
              <button
                type="button"
                data-view="month"
                aria-pressed="true"
                data-od-id="view-month"
              >
                월
              </button>
              <button
                type="button"
                data-view="week"
                aria-pressed="false"
                data-od-id="view-week"
              >
                주
              </button>
              <button
                type="button"
                data-view="day"
                aria-pressed="false"
                data-od-id="view-day"
              >
                일
              </button>
            </div>
            <button
              type="button"
              class="text-btn sm"
              id="go-today"
              data-od-id="cal-today"
            >
              오늘
            </button>
          </div>
        </header>

        <div class="cols">
          <section id="grid-wrap" data-od-id="cal-grid"></section>
          <section class="section" data-od-id="cal-day-list">
            <div class="section-head">
              <h2 id="list-title" data-od-id="cal-list-title">
                10월 14일 수요일
              </h2>
            </div>
            <ul class="list" id="list"></ul>
            <div class="section-note">
              <span class="status" data-tone="private">민호님의 개인 일정</span>
              은 시간만 보여요.
            </div>
          </section>
        </div>
      </main>
    </div>

    <!-- 새 일정 (CAL-01~05, CAL-11) -->
    <dialog
      class="sheet"
      id="sheet-new"
      aria-labelledby="new-title"
      data-od-id="sheet-new-event"
    >
      <form id="form-new" novalidate>
        <div class="sheet-head">
          <button
            type="button"
            class="text-btn"
            data-close
            data-od-id="new-cancel"
          >
            취소
          </button>
          <h2 id="new-title">새 일정</h2>
          <button
            type="submit"
            class="text-btn"
            style="font-weight: 600"
            data-od-id="new-save"
          >
            추가
          </button>
        </div>
        <div class="field-row" id="row-title">
          <label for="f-title">제목</label
          ><input
            id="f-title"
            name="title"
            class="left"
            style="text-align: left"
            placeholder="제목"
            autocomplete="off"
            data-od-id="f-title"
          />
        </div>
        <div class="field-row">
          <label for="f-place">장소</label
          ><input
            id="f-place"
            name="place"
            style="text-align: left"
            placeholder="선택"
            data-od-id="f-place"
          />
        </div>

        <div class="group-label">시간</div>
        <div class="field-row">
          <span class="label">종일</span
          ><span class="control switch"
            ><input
              type="checkbox"
              id="f-allday"
              aria-label="종일"
              data-od-id="f-allday"
          /></span>
        </div>
        <div class="field-row">
          <label for="f-date">시작</label
          ><input
            id="f-date"
            type="date"
            value="2026-10-14"
            data-od-id="f-start-date"
          /><input
            id="f-time"
            type="time"
            value="19:00"
            style="flex: 0 0 96px"
            data-od-id="f-start-time"
          />
        </div>
        <div class="field-row">
          <label for="f-end">종료</label
          ><input
            id="f-end"
            type="date"
            value="2026-10-14"
            data-od-id="f-end-date"
          /><input
            id="f-end-time"
            type="time"
            value="20:00"
            style="flex: 0 0 96px"
            data-od-id="f-end-time"
          />
        </div>
        <div class="field-row">
          <label for="f-remind">알림</label>
          <select id="f-remind" data-od-id="f-remind">
            <option>없음</option>
            <option>10분 전</option>
            <option selected>30분 전</option>
            <option>1시간 전</option>
            <option>하루 전</option>
          </select>
        </div>

        <div class="group-label">분류</div>
        <div class="field-row">
          <label for="f-cat">카테고리</label>
          <span class="cat-select"
            ><span class="cat" id="cat-dot"></span>
            <select id="f-cat" data-od-id="f-category"></select
          ></span>
        </div>
        <div class="field-row">
          <span class="label">개인 일정</span
          ><span class="control switch"
            ><input
              type="checkbox"
              id="f-private"
              aria-label="개인 일정"
              data-od-id="f-private"
          /></span>
        </div>
        <p class="form-note" id="private-note">
          기본은 둘 다 참석하는 공유 일정이에요.
        </p>

        <div class="group-label">메모</div>
        <div class="field-row">
          <label for="f-memo" class="sr-only">메모</label
          ><textarea
            id="f-memo"
            placeholder="메모"
            data-od-id="f-memo"
          ></textarea>
        </div>
      </form>
    </dialog>

    <!-- 일정 상세 -->
    <dialog
      class="sheet"
      id="sheet-detail"
      aria-labelledby="d-title"
      data-od-id="sheet-event-detail"
    >
      <div class="sheet-head">
        <span></span>
        <h2>일정</h2>
        <button
          type="button"
          class="text-btn"
          data-close
          data-od-id="detail-done"
        >
          완료
        </button>
      </div>
      <div style="padding-top: 16px">
        <h3 class="t-title2" id="d-title"></h3>
        <dl class="detail" id="d-body"></dl>
        <div style="margin-top: 32px">
          <button
            type="button"
            class="text-btn danger"
            id="d-delete"
            data-od-id="detail-delete"
          >
            일정 삭제
          </button>
        </div>
      </div>
    </dialog>

    <script src="js/app.js"></script>
    <script>
      /* ---------- Data (2026년 10월, 오늘 14일) --------------------------- */
      /* 카테고리 · 색은 설정 > 일정 카테고리(lists.html#cal)에서 관리 */
      var CATS = KJ.lists.get("cal"),
        CAT = {},
        CATC = {};
      CATS.forEach(function (c) {
        CAT[c.id] = c.name;
        CATC[c.id] = c.color;
      });
      function catId(id) {
        return CAT[id] ? id : "etc";
      }
      var EV = [
        { d: 3, t: "종일", title: "개천절", cat: "etc" },
        {
          d: 9,
          t: "18:00",
          title: "한글날 저녁",
          cat: "family",
          place: "분당",
        },
        { d: 12, t: "09:00", title: "주간 회의", cat: "work" },
        {
          d: 14,
          t: "10:30",
          title: "치과 정기검진",
          cat: "clinic",
          place: "연세바른치과",
          remind: "30분 전",
          owner: "지수",
        },
        { d: 14, t: "14:00", end: "16:00", priv: true },
        {
          d: 14,
          t: "19:30",
          title: "성수동 저녁 약속",
          cat: "meet",
          place: "대림창고 근처",
          owner: "민호",
          memo: "7시 20분에 성수역 3번 출구",
        },
        { d: 15, t: "종일", title: "아파트 방역 소독", cat: "home" },
        {
          d: 17,
          t: "12:00",
          title: "부모님 댁 점심",
          cat: "family",
          place: "분당",
        },
        {
          d: 17,
          t: "15:00",
          title: "이케아 가구 보기",
          cat: "meet",
          place: "광명점",
        },
        { d: 18, t: "10:00", priv: true },
        {
          d: 19,
          t: "D-day",
          title: "민호 생일",
          cat: "clinic",
          celebrate: true,
        },
        {
          d: 21,
          t: "09:00",
          title: "하반기 워크숍",
          cat: "work",
          owner: "지수",
        },
        {
          d: 24,
          t: "13:00",
          title: "건강검진",
          cat: "clinic",
          private: true,
          owner: "지수",
        },
        { d: 28, t: "20:00", title: "관리비 납부", cat: "home" },
      ];
      var DOW = ["일", "월", "화", "수", "목", "금", "토"];
      var FIRST = 4; // 2026-10-01 = 목요일
      var view = "month",
        sel = 14;
      var grid = document.getElementById("grid-wrap");

      function dowOf(d) {
        return DOW[(FIRST + d - 1) % 7];
      }
      function evOf(d) {
        return EV.filter(function (e) {
          return e.d === d;
        });
      }
      function dot(e) {
        return e.priv
          ? "var(--sys-gray3)"
          : e.celebrate
            ? "var(--celebrate)"
            : KJ.lists.color(CATC[catId(e.cat)]);
      }

      function rowHTML(e, i) {
        if (e.priv)
          return (
            '<li class="is-private" data-od-id="cal-ev-priv-' +
            e.d +
            '"><span class="time">' +
            e.t +
            '</span><span class="cat private"></span><div class="grow"><div class="title">개인 일정</div><div class="meta">민호님' +
            (e.end ? " · " + e.end + "까지" : "") +
            '</div></div><span class="trail">' +
            KJ.icon("lock", "chev") +
            "</span></li>"
          );
        return (
          '<li class="row-click" tabindex="0" data-i="' +
          EV.indexOf(e) +
          '" data-od-id="cal-ev-' +
          e.d +
          "-" +
          i +
          '"><span class="time">' +
          e.t +
          '</span><span class="cat" style="--c:' +
          dot(e) +
          '"></span>' +
          '<div class="grow"><div class="title">' +
          e.title +
          '</div><div class="meta">' +
          [e.place, CAT[catId(e.cat)], e.private ? "나만 보기" : ""]
            .filter(Boolean)
            .join(" · ") +
          "</div></div>" +
          KJ.icon("chevron", "chev") +
          "</li>"
        );
      }

      function renderMonth() {
        var cells = "",
          lead = FIRST;
        for (var i = 0; i < lead; i++)
          cells +=
            '<button type="button" class="out" disabled><span class="d">' +
            (27 + i) +
            "</span></button>";
        for (var d = 1; d <= 31; d++) {
          var ev = evOf(d),
            col = (FIRST + d - 1) % 7;
          cells +=
            '<button type="button" class="' +
            (col === 0 ? "sun " : "") +
            (d === 14 ? "today" : "") +
            '" aria-pressed="' +
            (d === sel) +
            '" data-day="' +
            d +
            '" aria-label="10월 ' +
            d +
            "일, 일정 " +
            ev.length +
            '개" data-od-id="month-day-' +
            d +
            '">' +
            '<span class="d">' +
            d +
            '</span><span class="dots">' +
            ev
              .slice(0, 3)
              .map(function (e) {
                return '<i style="--c:' + dot(e) + '"></i>';
              })
              .join("") +
            "</span></button>";
        }
        var tail = (7 - ((lead + 31) % 7)) % 7;
        for (var j = 1; j <= tail; j++)
          cells +=
            '<button type="button" class="out" disabled><span class="d">' +
            j +
            "</span></button>";
        grid.innerHTML =
          '<div class="dow-row">' +
          DOW.map(function (w) {
            return "<span>" + w + "</span>";
          }).join("") +
          '</div><div class="month">' +
          cells +
          "</div>";
      }
      function weekStart(d) {
        return d - ((FIRST + d - 1) % 7);
      }
      function renderWeek() {
        var s = weekStart(sel),
          out = "";
        for (var d = s; d < s + 7; d++) {
          if (d < 1 || d > 31) continue;
          var ev = evOf(d);
          out +=
            '<div class="group-label"' +
            (d === 14 ? ' style="color:var(--accent-text)"' : "") +
            ">10월 " +
            d +
            "일 " +
            dowOf(d) +
            "요일" +
            (d === 14 ? " · 오늘" : "") +
            "</div>" +
            '<ul class="list">' +
            (ev.length
              ? ev.map(rowHTML).join("")
              : '<li class="tertiary t-subhead">일정 없음</li>') +
            "</ul>";
        }
        grid.innerHTML = out;
      }
      function renderDay() {
        var ev = evOf(sel),
          out = '<ul class="list hours" style="margin-top:12px">';
        var allDay = ev.filter(function (e) {
          return !/^\d/.test(e.t);
        });
        if (allDay.length)
          out +=
            '<li><span class="h">종일</span><div class="slot">' +
            allDay
              .map(function (e) {
                return (
                  '<button type="button" class="ev" data-i="' +
                  EV.indexOf(e) +
                  '"><span class="cat" style="--c:' +
                  dot(e) +
                  '"></span>' +
                  e.title +
                  "</button>"
                );
              })
              .join("") +
            "</div></li>";
        for (var h = 8; h <= 22; h++) {
          var hh = String(h).padStart(2, "0");
          var at = ev.filter(function (e) {
            return e.t.slice(0, 2) === hh;
          });
          out +=
            '<li data-od-id="hour-' +
            hh +
            '"><span class="h">' +
            hh +
            ':00</span><div class="slot">' +
            at
              .map(function (e) {
                return e.priv
                  ? '<span class="ev is-private"><span class="cat private"></span>개인 일정 · 민호님</span>'
                  : '<button type="button" class="ev" data-i="' +
                      EV.indexOf(e) +
                      '"><span class="cat" style="--c:' +
                      dot(e) +
                      '"></span>' +
                      e.t +
                      " " +
                      e.title +
                      "</button>";
              })
              .join("") +
            "</div></li>";
        }
        grid.innerHTML = out + "</ul>";
      }
      function renderList() {
        document.getElementById("list-title").textContent =
          "10월 " + sel + "일 " + dowOf(sel) + "요일";
        var ev = evOf(sel);
        document.getElementById("list").innerHTML = ev.length
          ? ev.map(rowHTML).join("")
          : '<li><div class="grow secondary">등록된 일정이 없어요</div><button type="button" class="text-btn sm" data-new data-od-id="list-add">일정 추가</button></li>';
      }
      function render() {
        document.getElementById("cal-title").textContent =
          view === "day"
            ? "10월 " + sel + "일 " + dowOf(sel) + "요일"
            : "2026년 10월";
        ({ month: renderMonth, week: renderWeek, day: renderDay })[view]();
        document.querySelector('[data-od-id="cal-day-list"]').hidden =
          view !== "month";
      }

      /* ---------- Interactions ------------------------------------------- */
      document
        .querySelector('[data-od-id="cal-view"]')
        .addEventListener("click", function (e) {
          var b = e.target.closest("[data-view]");
          if (!b) return;
          view = b.getAttribute("data-view");
          this.querySelectorAll("button").forEach(function (x) {
            x.setAttribute("aria-pressed", x === b);
          });
          render();
        });
      grid.addEventListener("click", function (e) {
        var day = e.target.closest("[data-day]");
        if (day) {
          sel = +day.getAttribute("data-day");
          render();
          renderList();
          return;
        }
        var ev = e.target.closest("[data-i]");
        if (ev) openDetail(+ev.getAttribute("data-i"));
      });
      document.getElementById("list").addEventListener("click", function (e) {
        var ev = e.target.closest("[data-i]");
        if (ev) openDetail(+ev.getAttribute("data-i"));
        if (e.target.closest("[data-new]")) openNew();
      });
      document.getElementById("list").addEventListener("keydown", function (e) {
        if (e.key === "Enter" && e.target.dataset.i)
          openDetail(+e.target.dataset.i);
      });
      document.getElementById("prev").onclick = function () {
        var step = view === "month" ? 0 : view === "week" ? 7 : 1;
        if (step) {
          sel = Math.max(1, sel - step);
          render();
          renderList();
        } else KJ.toast("9월 일정을 불러왔어요");
      };
      document.getElementById("next").onclick = function () {
        var step = view === "month" ? 0 : view === "week" ? 7 : 1;
        if (step) {
          sel = Math.min(31, sel + step);
          render();
          renderList();
        } else KJ.toast("11월 일정을 불러왔어요");
      };
      document.getElementById("go-today").onclick = function () {
        sel = 14;
        render();
        renderList();
      };

      /* 상세 + 삭제 확인 (CAL-05, CAL-12) */
      var detail = document.getElementById("sheet-detail"),
        current = null;
      function openDetail(i) {
        var e = EV[i];
        if (!e || e.priv) return;
        current = i;
        document.getElementById("d-title").textContent = e.title;
        document.getElementById("d-body").innerHTML =
          "<dt>날짜</dt><dd>2026년 10월 " +
          e.d +
          "일 " +
          dowOf(e.d) +
          "요일 · " +
          e.t +
          "</dd>" +
          (e.place ? "<dt>장소</dt><dd>" + e.place + "</dd>" : "") +
          '<dt>카테고리</dt><dd style="display:flex;gap:8px;align-items:center"><span class="cat" style="--c:' +
          dot(e) +
          '"></span>' +
          (e.celebrate ? "축하 D-day" : CAT[catId(e.cat)]) +
          "</dd>" +
          "<dt>참석</dt><dd>" +
          (e.private ? "나만 보기 (개인 일정)" : "둘 다") +
          "</dd>" +
          (e.remind ? "<dt>알림</dt><dd>" + e.remind + "</dd>" : "") +
          (e.memo ? "<dt>메모</dt><dd>" + e.memo + "</dd>" : "");
        detail.showModal();
      }
      document.getElementById("d-delete").onclick = function () {
        var e = EV[current];
        KJ.confirm({
          title: "‘" + e.title + "’ 일정을 삭제할까요?",
          body: e.private
            ? "삭제한 일정은 되돌릴 수 없어요."
            : "민호님에게도 삭제 알림이 가요.",
          confirmLabel: "삭제",
          destructive: true,
        }).then(function (ok) {
          if (!ok) return;
          EV.splice(current, 1);
          detail.close();
          render();
          renderList();
          KJ.toast("일정을 삭제했어요");
        });
      };

      /* 새 일정 */
      var sheetNew = document.getElementById("sheet-new"),
        form = document.getElementById("form-new");
      function openNew() {
        form.reset();
        document.getElementById("f-date").value =
          "2026-10-" + String(sel).padStart(2, "0");
        document.getElementById("f-end").value =
          document.getElementById("f-date").value;
        syncPrivate();
        syncAllDay();
        syncCatDot();
        document.getElementById("row-title").classList.remove("invalid");
        sheetNew.showModal();
        document.getElementById("f-title").focus();
      }
      document.getElementById("add").onclick = openNew;
      document.querySelectorAll("[data-close]").forEach(function (b) {
        b.onclick = function () {
          b.closest("dialog").close();
        };
      });
      document.getElementById("f-cat").innerHTML = CATS.map(function (c) {
        return '<option value="' + c.id + '">' + c.name + "</option>";
      }).join("");
      function syncCatDot() {
        document
          .getElementById("cat-dot")
          .style.setProperty(
            "--c",
            KJ.lists.color(CATC[document.getElementById("f-cat").value]),
          );
      }
      document.getElementById("f-cat").onchange = syncCatDot;
      function syncPrivate() {
        document.getElementById("private-note").textContent =
          document.getElementById("f-private").checked
            ? "나만 내용을 볼 수 있어요. 민호님에게는 시간만 표시돼요."
            : "기본은 둘 다 참석하는 공유 일정이에요.";
      }
      function syncAllDay() {
        var on = document.getElementById("f-allday").checked;
        ["f-time", "f-end-time"].forEach(function (id) {
          document.getElementById(id).hidden = on;
        });
      }
      document.getElementById("f-private").onchange = syncPrivate;
      document.getElementById("f-allday").onchange = syncAllDay;
      document.getElementById("f-title").oninput = function () {
        document.getElementById("row-title").classList.remove("invalid");
      };
      form.addEventListener("submit", function (e) {
        e.preventDefault();
        var title = document.getElementById("f-title").value.trim();
        if (!title) {
          var r = document.getElementById("row-title");
          r.classList.add("invalid");
          document
            .getElementById("f-title")
            .setAttribute("aria-invalid", "true");
          document.getElementById("f-title").focus();
          return;
        }
        var d = +document.getElementById("f-date").value.slice(-2);
        EV.push({
          d: d,
          t: document.getElementById("f-allday").checked
            ? "종일"
            : document.getElementById("f-time").value,
          title: title,
          cat: document.getElementById("f-cat").value,
          place: document.getElementById("f-place").value.trim(),
          private: document.getElementById("f-private").checked,
          remind: document.getElementById("f-remind").value,
          memo: document.getElementById("f-memo").value.trim(),
          owner: "지수",
        });
        EV.sort(function (a, b) {
          return a.d - b.d || a.t.localeCompare(b.t);
        });
        sel = d;
        sheetNew.close();
        render();
        renderList();
        KJ.toast(
          document.getElementById("f-private").checked
            ? "개인 일정을 추가했어요"
            : "일정을 추가했어요. 민호님에게도 알려 드렸어요",
        );
      });

      render();
      renderList();
      KJ.init();
      if (location.hash === "#new") openNew();
    </script>
  </body>
</html>
